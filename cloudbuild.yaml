steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest', '.']
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # A WebSocket is one long-lived request; Cloud Run's default 300s request
      # timeout would cut the Live session off five minutes in. 3600s is the max.
      - '--timeout'
      - '3600'
      # Instance bounds, kept identical to deploy.sh. Both files deploy the same
      # service, so a difference here silently reverts the other's settings on
      # whichever ran last.
      #
      # 0 scales to nothing when idle, so a forgotten deploy stops costing
      # anything; the price is a cold start (ADK + google-genai is a slow
      # import) landing on the first connection of a session.
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      # 1 container, so a shared public link cannot fan out into many concurrent
      # billed Live sessions. Not a one-user cap -- default concurrency is 80
      # requests per instance, and CPU is the real ceiling.
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--labels'
      - 'dev-tutorial=multi-modal'
      # ALLOWED_ORIGINS gates the WebSocket handshake, which CORS does not cover.
      # Empty means accept any origin -- set _ALLOWED_ORIGINS to the service URL.
      - '--set-env-vars'
      - 'GOOGLE_GENAI_USE_VERTEXAI=False,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},MODEL_ID=${_MODEL_ID},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}'
      # The API key comes from Secret Manager, never from a build substitution
      # (substitutions are retained in build history and readable there).
      - '--set-secrets'
      - 'GOOGLE_API_KEY=${_SECRET_NAME}:latest,GEMINI_API_KEY=${_SECRET_NAME}:latest,GEMINI_KEY=${_SECRET_NAME}:latest'

# Automatically push the image built in the first step
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

timeout: 800s

substitutions:
  _SERVICE_NAME: dog-or-not
  _REGION: us-central1
  # Same defaults as deploy.sh's MIN_INSTANCES / MAX_INSTANCES. Override at
  # submit time: --substitutions=_MIN_INSTANCES=1,_MAX_INSTANCES=4
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '1'
  # Comma-separated origin allowlist for the WebSocket handshake. Empty accepts
  # any origin, which is only appropriate before the service URL is known.
  _ALLOWED_ORIGINS: ''
  # Run ./deploy.sh once to create this secret and grant the Cloud Run runtime
  # service account roles/secretmanager.secretAccessor on it.
  _SECRET_NAME: gemini-api-key
  # The public default is GA. Override at submit time for a non-public build:
  #   gcloud builds submit --substitutions=_MODEL_ID=<id>
  # Note the caveat above -- substitutions are retained in build history, so an
  # overridden id is readable by anyone with access to the project's builds.
  _MODEL_ID: gemini-2.5-flash-native-audio-latest

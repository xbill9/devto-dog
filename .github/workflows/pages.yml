name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The landing page goes to the site root so the DEV embed URL is clean.
      # The standalone CSS art rides along at /css-art/.
      - name: Assemble the site
        run: |
          mkdir -p _site/css-art
          cp landing/index.html landing/styles.css landing/app.js _site/
          cp css-art/index.html _site/css-art/
          # Pages runs Jekyll by default, which would eat any _underscore paths.
          touch _site/.nojekyll

      # Built from css-art/codepen/pen.* at deploy time so the one-click
      # CodePen button can never drift from the files it ships.
      - name: Build the CodePen prefill button
        run: python3 tools/make-prefill.py _site/new-pen.html

      - name: Check the files landed
        run: |
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/css-art/index.html
          test -s _site/new-pen.html
          # the prefill payload must be parseable JSON, or the button is a dud
          python3 - <<'PY'
          import re, json, pathlib
          p = pathlib.Path('_site/new-pen.html').read_text()
          blob = re.search(r'id="payload">(.*?)</script>', p, re.S).group(1)
          d = json.loads(blob.replace('<\\/script', '</script'))
          assert d['html'] and d['css'] and d['js'], 'empty panel in prefill payload'
          print('prefill payload OK:', {k: len(v) for k, v in d.items() if isinstance(v, str)})
          PY
          echo "--- published tree ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

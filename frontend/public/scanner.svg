<!--
  Tab icon. The same dog-in-a-reticle mark as the idle screen, redrawn for
  16px: the reticle is a plain ring and the head loses its dashed ring and
  corner ticks, which at favicon size read as dirt on the screen.
  Replaces Vite's default logo, which was still the icon of a scanner that
  detects dogs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#04121a"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#00ffff" stroke-opacity="0.55" stroke-width="3"/>
  <g transform="translate(32 31) scale(0.78)" fill="#00ffff">
    <ellipse cx="-20" cy="2" rx="8" ry="19"/>
    <ellipse cx="20" cy="2" rx="8" ry="19"/>
    <ellipse cx="0" cy="-5" rx="19" ry="16"/>
    <ellipse cx="0" cy="12" rx="13" ry="10"/>
    <circle cx="-8" cy="-7" r="3" fill="#04121a"/>
    <circle cx="8" cy="-7" r="3" fill="#04121a"/>
    <ellipse cx="0" cy="8" rx="5" ry="3.8" fill="#04121a"/>
  </g>
</svg>

# Cloud Run routes traffic to $PORT (8080 by default), not port 80.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Static assets are content-addressed by deploy, not by filename, so keep
    # the HTML fresh and let CSS/JS be cached for a short while.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The page is entirely self-contained: no external requests at all.
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";

    # No client-side routing here, so a missing asset must 404 rather than
    # quietly returning index.html with a 200.
    location / {
        try_files $uri $uri/ =404;
    }
}
